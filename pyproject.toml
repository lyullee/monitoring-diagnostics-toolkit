[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-diagnostics-toolkit"
version = "0.17.0"
description = "Equipment-specific physical residuals and process monitoring with explicit SI sensor contracts"
authors = [{name = "Ugwiyeon Lee"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["condition-monitoring", "fault-detection", "process-monitoring", "physical-residuals", "equipment-diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Homepage = "https://github.com/lyullee/monitoring-diagnostics-toolkit"
Documentation = "https://github.com/lyullee/monitoring-diagnostics-toolkit/blob/main/README.md"
Repository = "https://github.com/lyullee/monitoring-diagnostics-toolkit"
Issues = "https://github.com/lyullee/monitoring-diagnostics-toolkit/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
learning = ["scikit-learn>=1.5,<2"]
physics = ["pytest>=8,<10", "ht>=1.2,<2", "fluids>=1.3,<2", "CoolProp>=7.1,<9"]
public-data = ["pandas>=2,<4", "xlrd>=2,<3", "openpyxl>=3.1,<4", "scipy>=1.14,<2", "CoolProp>=7.1,<9"]

[project.scripts]
equipment-diagnose = "equipment_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration and not physics'"
markers = ["integration: requires explicit local upstream source checkouts and their runtime dependencies",
           "physics: independent forward models, limiting cases and numerical verification"]
