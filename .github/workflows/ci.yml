name: software-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,physics,learning,public-data]" build twine
      - run: python -m pytest -o addopts="" -m "not integration" --junitxml=verification.xml
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/release_audit.py
