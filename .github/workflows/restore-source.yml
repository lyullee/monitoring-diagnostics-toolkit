# Initial source restoration is complete and preserved in Git history.
# The remaining manual workflow verifies archive identity and never rewrites code.
name: verify-reviewed-release-archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              'monitoring_diagnostics_toolkit-0.17.0.tar.gz': '2685abaabf4562515c1c3168e8b5dbbcf9bf87931e7af3a715c844124f7f02dd',
              'monitoring_diagnostics_toolkit-0.17.0-py3-none-any.whl': '50e8d2141540caa89b5d4d1d874715a562ab3d064afb661bf0aef310046281fc'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest
          print('Reviewed public archive hashes match; no source files changed.')
          PY
