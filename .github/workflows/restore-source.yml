# Initial source restoration is complete and preserved in Git history.
# The remaining manual workflow verifies archive identity and never rewrites code.
name: verify-reviewed-release-archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          import hashlib, pathlib
          import json
          expected = json.loads(pathlib.Path('release-assets.json').read_text())['artifacts']
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest
          print('Reviewed public archive hashes match; no source files changed.')
          PY
