name: publish-release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,physics,learning,public-data]" build twine
      - name: Require tag/version agreement
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os,equipment_diagnostics as e; assert os.environ['RELEASE_TAG']=='v'+e.__version__"
      - run: python -m pytest -o addopts="" -m "not integration"
      - run: python -m build --outdir build_check
      - run: python -m twine check build_check/*
      - name: Use the exact archives reviewed and deposited in Zenodo
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          import equipment_diagnostics as e
          manifest = json.loads(pathlib.Path('release-assets.json').read_text())
          assert manifest['version'] == e.__version__
          expected = manifest['artifacts']
          assert len(expected) == 2
          pathlib.Path('dist').mkdir()
          for name, digest in expected.items():
              assert pathlib.Path(name).name == name
              assert name.startswith('monitoring_diagnostics_toolkit-'+e.__version__)
              source = pathlib.Path(name)
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
              shutil.copyfile(source, pathlib.Path('dist')/name)
          PY
      - run: python scripts/release_audit.py
      - run: python scripts/verify_public_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/monitoring-diagnostics-toolkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
